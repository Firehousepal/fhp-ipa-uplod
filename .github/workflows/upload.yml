name: Upload IPA to App Store Connect

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Locate IPA
        run: |
          set -e
          echo "Searching for IPA..."
          find . -name "*.ipa" -type f -ls

          IPA=$(find . -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: No .ipa file found in this repo."
            exit 1
          fi

          echo "Found IPA: $IPA"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -e

          if [ -z "$ASC_KEY_ID" ]; then
            echo "ERROR: ASC_KEY_ID secret is missing."
            exit 1
          fi

          if [ -z "$ASC_ISSUER_ID" ]; then
            echo "ERROR: ASC_ISSUER_ID secret is missing."
            exit 1
          fi

          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "ERROR: ASC_PRIVATE_KEY secret is missing."
            exit 1
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          IPA=$(find . -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: No .ipa file found."
            exit 1
          fi

          echo "Uploading: $IPA"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose
